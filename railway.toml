# Railway Deployment Configuration for ExamOS
# Reference: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r backend/requirements.txt && python -m ml.train"

[deploy]
startCommand = "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
